name: jitter.yml - Test GitHub Cron Jitter

on:
  schedule:
    - cron: 7,13,17,23,31,37,43,47,53 * 31 10 *
    - cron: 7,13,17,23,31,37,43,47,53 * 1 11 *

permissions:
  contents: read

jobs:
  test-cron:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Jitter Test
        run: |
          echo "$(date +'%F %T')"
